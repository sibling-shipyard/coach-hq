name: Validate SOUL composition

# platform/artifacts/propagated/SOUL.md is a generated artifact from platform/soul/ via platform/scripts/compose-soul.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'platform/artifacts/propagated/SOUL.md'
      - 'platform/soul/**'
      - 'platform/scripts/compose-soul.mjs'
  pull_request:
    paths:
      - 'platform/artifacts/propagated/SOUL.md'
      - 'platform/soul/**'
      - 'platform/scripts/compose-soul.mjs'

jobs:
  validate-soul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert platform/artifacts/propagated/SOUL.md matches composed output
        run: node platform/scripts/compose-soul.mjs --check
