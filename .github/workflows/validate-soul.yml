name: Validate SOUL composition

# propagated/SOUL.md is a generated artifact from engine/soul/ via engine/scripts/compose-soul.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'propagated/SOUL.md'
      - 'engine/soul/**'
      - 'engine/scripts/compose-soul.mjs'
  pull_request:
    paths:
      - 'propagated/SOUL.md'
      - 'engine/soul/**'
      - 'engine/scripts/compose-soul.mjs'

jobs:
  validate-soul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert propagated/SOUL.md matches composed output
        run: node engine/scripts/compose-soul.mjs --check
