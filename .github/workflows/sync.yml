name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run sync pipeline
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/run_sync_pipeline.py

      - name: Populate last_week
        run: |
          mkdir -p training/last_week
          CUTOFF=$(date -d '6 days ago' +%Y-%m-%d)
          rm -f training/last_week/*.json
          for f in training/history/*.json; do
            [ -f "$f" ] || continue
            ACT_DATE=$(python3 -c "import json; print(json.load(open('$f')).get('start_date','')[:10])" 2>/dev/null || echo "")
            if [ "$ACT_DATE" \> "$CUTOFF" ] || [ "$ACT_DATE" = "$CUTOFF" ]; then
              cp "$f" training/last_week/
            fi
          done
          echo "last_week contains $(ls training/last_week/ 2>/dev/null | wc -l) activities"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate widget snapshots
        working-directory: ui
        run: npm ci && npm run generate-snapshots

      - name: Commit pipeline changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ui/client/src/data/
          git restore --staged strava/strava_tokens.json 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            MSG=$(python3 -c "import json; print(json.load(open('training/sync_status.json'))['commit_message'])" 2>/dev/null || echo "core: sync pipeline run [skip ci]")
            git commit -m "$MSG"
            git push
          fi
