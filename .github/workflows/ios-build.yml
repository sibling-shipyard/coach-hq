name: iOS Build

# Compiles the CoachHQ app + CoachHQWidgetExtension on every ios/ change, and runs the
# CoachHQTests unit suite. No code signing needed (simulator only). It exists to catch compile
# errors like the WorkoutType enum change in #256/#257, which had to be reviewed by hand since
# there's no Mac in this dev loop otherwise.
#
# The test job needs a concrete simulator, not 'generic/platform=iOS Simulator' - a generic
# destination can build but cannot run. platform/tests/*.py still has no runner (#343/#329).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/CoachHQ
    strategy:
      matrix:
        scheme: [CoachHQ, CoachHQWidgetExtension]
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        # Deployment target is iOS 26.x, which needs Swift 6.2 (SWIFT_DEFAULT_ACTOR_ISOLATION
        # etc.). Pinned rather than left to the image default so a runner-image bump cannot
        # move the toolchain under us. If this step starts failing (path not found), GitHub
        # has changed the macos-26 image - run `ls /Applications | grep Xcode` in a throwaway
        # step to find the current path and update it here (see #260/7c85ca2 for how this was
        # originally diagnosed).
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Provide Secrets.swift
        # Secrets.swift is gitignored (real config, not committed) - the .example template
        # has production defaults that are enough to compile with.
        run: cp CoachHQ/Secrets.swift.example CoachHQ/Secrets.swift

      - name: Build ${{ matrix.scheme }} for iOS Simulator
        run: |
          xcodebuild build \
            -project CoachHQ.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        # Only on the app scheme - the widget extension has no test target of its own, and
        # running this twice would just re-run the same suite.
        #
        # OS=26.5 is pinned, and is why this job runs on macos-26. Simulator iOS 26.2 - the
        # newest macos-15 offered - has a bad free in swift_task_deinitOnExecutorImpl, so any
        # main-actor class released inside a synchronous test body kills the host (#585). If
        # the image stops shipping 26.5 this fails loudly on an unknown destination; pick the
        # next runtime up rather than dropping the pin.
        if: matrix.scheme == 'CoachHQ'
        run: |
          xcodebuild test \
            -project CoachHQ.xcodeproj \
            -scheme CoachHQ \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
