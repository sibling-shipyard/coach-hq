name: Eval Coach Chat

# ADR 0047 (kdb/decisions/0047-eval-coach-chat-manual-dispatch-only.md) governs this trigger:
# eval:coach-chat calls the live Gemini/OpenRouter API once per transcript - it is a paid check
# that runs only on manual dispatch. This superseded ADR 0024's push-on-named-paths gate: that
# gate ran unattended for weeks with nobody watching it, so its real cost bought no real safety.
#
# DO NOT add a push or pull_request trigger. Run it deliberately, when someone is actually
# testing this area, the same discipline every other paid check in this repo already uses.

on:
  workflow_dispatch:

jobs:
  eval-coach-chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coach-chat eval harness
        # This has been failing on every run against direct Gemini - the account's
        # GEMINI_API_KEY credit is depleted (429 RESOURCE_EXHAUSTED), the same dev-environment
        # state docs/eng-docs/llm-provider-current.md already documents for local runs. I'm
        # routing this at OpenRouter for the same reason every local live/manual/eval run
        # already has to - not a permanent provider decision, just matching the interim state
        # everything else in this repo is already running in. Switch back to direct once
        # GEMINI_API_KEY has real credit again.
        run: npm run eval:coach-chat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
