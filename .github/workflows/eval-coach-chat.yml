name: Eval Coach Chat

# ADR 0024 (kdb/decisions/0024-paid-checks-run-at-gates.md) governs this trigger:
# eval:coach-chat calls the live Gemini API once per transcript — it is a paid check that only
# runs at named gates. The two named gates are:
#   1. Manual dispatch — operator-driven, on demand.
#   2. Push to main when the diff touches prompt construction, the response schema, the model
#      config, or the eval harness/fixtures — the only diffs where the eval can actually fail.
#
# DO NOT add a pull_request trigger. ADR 0024 explicitly forbids it: running a paid check
# reflexively on every PR normalises ignoring red and decays the signal into noise.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Prompt construction
      - 'ui/api/coach-chat/_lib/gemini/coachPromptText.ts'
      - 'ui/api/coach-chat/_lib/decide/coachContext.ts'
      # Response schema
      - 'ui/api/coach-chat/_lib/gemini/coachReplySchema.ts'
      # Model config
      - 'ui/api/coach-chat/_lib/gemini/geminiClient.ts'
      # Eval harness and fixtures
      - 'ui/scripts/eval-coach-chat.ts'
      - 'ui/api/coach-chat/_tests/coach-chat-eval/**'

jobs:
  eval-coach-chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coach-chat eval harness
        # This has been failing on every run against direct Gemini - the account's
        # GEMINI_API_KEY credit is depleted (429 RESOURCE_EXHAUSTED), the same dev-environment
        # state docs/eng-docs/llm-provider-current.md already documents for local runs. I'm
        # routing this at OpenRouter for the same reason every local live/manual/eval run
        # already has to - not a permanent provider decision, just matching the interim state
        # everything else in this repo is already running in. Switch back to direct once
        # GEMINI_API_KEY has real credit again.
        run: npm run eval:coach-chat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
