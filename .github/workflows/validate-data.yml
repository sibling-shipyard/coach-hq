name: Validate data

# The shared safety net (scaling-plan §6.4). Guards the coach's direct-to-main
# lane — training/state.md, sleep_log.json, challenge_v2.json, sessions/** are
# committed to main without a PR (SOUL.md / Layer B §2, §13). A malformed or
# contract-breaking file would break the Vercel dashboard build unreviewed.
#
# Both runtimes pass through the SAME gate: a BYO Claude Code session runs
# scripts/validate-repo.py as its VALIDATE capability before commit, and this
# workflow re-runs it on the push to main as the backstop. Severity is graduated
# (see docs/soul-split-m0.md): ERROR fails the build; WARNING surfaces pre-existing
# drift without failing. Also verifies the generated SOUL.md is in sync with
# soul/*.md, that no v1.0/v5.6 coaching rule was dropped (parity), and that the
# widget_snapshots.json contract holds.

on:
  push:
    branches: [main]
    paths:
      - 'training/challenge_v2.json'
      - 'training/state.md'
      - 'training/sleep_log.json'
      - 'training/widget_snapshots.json'
      - 'sessions/*.json'
      - 'SOUL.md'
      - 'soul/**'
      - 'scripts/compose-soul.mjs'
      - 'scripts/validate-repo.py'
      - 'scripts/parity-check.py'
      - 'docs/parity/**'
  pull_request:
    paths:
      - 'training/challenge_v2.json'
      - 'training/state.md'
      - 'training/sleep_log.json'
      - 'training/widget_snapshots.json'
      - 'sessions/*.json'
      - 'SOUL.md'
      - 'soul/**'
      - 'scripts/compose-soul.mjs'
      - 'scripts/validate-repo.py'
      - 'scripts/parity-check.py'
      - 'docs/parity/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate data contracts (+ SOUL drift)
        run: python3 scripts/validate-repo.py --repo . --format github
      - name: Parity — no coaching rule dropped (v1.0 + v5.6 baselines)
        run: python3 scripts/parity-check.py --repo .

  self-test:
    # The validator must pass its own fixtures: a valid mini-repo passes, and a
    # deliberately broken one fails. Proves the safety net actually catches things.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fixtures — valid repo passes
        run: python3 scripts/validate-repo.py --repo .github/validation-fixtures/valid
      - name: Fixtures — broken repo fails (expected non-zero)
        run: |
          if python3 scripts/validate-repo.py --repo .github/validation-fixtures/broken; then
            echo "::error::broken fixture unexpectedly PASSED — validator is not catching errors"
            exit 1
          else
            echo "broken fixture correctly failed"
          fi

  widget-snapshots:
    # The iOS/web widget data contract (training/widget_snapshots.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate widget_snapshots.json
        run: |
          python3 - <<'PY'
          import json, sys

          path = "training/widget_snapshots.json"
          try:
              with open(path) as fh:
                  data = json.load(fh)
          except FileNotFoundError:
              print(f"::error::{path} not found")
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f"::error::{path}: {e}")
              sys.exit(1)

          required = ("schema_version", "generated_at", "home")
          missing = [k for k in required if k not in data]
          if missing:
              print(f"::error::{path} missing required keys: {', '.join(missing)}")
              sys.exit(1)

          if data["schema_version"] != 1:
              print(f"::error::{path} schema_version must be 1, got {data['schema_version']!r}")
              sys.exit(1)

          print(f"Validated {path} — schema_version=1, required keys present.")
          PY
