name: Smoke Coach Message

# ADR 0024 (kdb/decisions/0024-paid-checks-run-at-gates.md) and ADR 0037
# (kdb/decisions/0037-scheduled-canaries-catch-upstream-drift.md) govern this trigger.
#
# This is a paid check: two live model calls per run, one per adapter. Its gate is a schedule,
# not a diff. It exists to catch the provider changing under us — thinking-mode behaviour, a
# schema regression, a truncation ceiling that moved (#827) — none of which arrives in a PR.
#
# DO NOT add a pull_request trigger. ADR 0024 explicitly forbids it: a paid check run
# reflexively on every PR normalises ignoring red and decays the signal into noise. Nothing in
# a PR diff changes what Google or OpenRouter did overnight, so a PR run buys no information.
#
# Both keys are required. The script fails naming the missing one rather than skipping that
# adapter — a canary that quietly tests nothing is worse than no canary.

on:
  schedule:
    # 06:15 UTC daily. Off the hour, because the top of the hour is when GitHub's scheduler is
    # most congested and a cron run is most likely to be delayed or dropped.
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  smoke-coach-message:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The canary sends the same SOUL production sends, and `api/_generated/soul.ts` is built,
      # not committed.
      - name: Build the composed SOUL bundle
        run: node scripts/build-soul.mjs

      - name: Run the coach-message live-model canary
        run: npx tsx --tsconfig tsconfig.json scripts/smoke-coach-message.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
