name: UI Tests

# Runs the ui/ Vitest suite (client components + api/auth serverless handlers). Added after
# a web-auth regression (issue #194) shipped with no CI catching it - tests existed locally
# but nothing ran them automatically.

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
  pull_request:
    paths:
      - 'ui/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test
