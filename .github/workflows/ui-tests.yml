name: UI Tests

# Runs the full UI Vitest suite (client components + API/auth serverless handlers). Changes to
# scripts/build are included because Vercel executes those files during the production build.

on:
  push:
    branches: [main]
    paths:
      - "ui/api/**"
      - "ui/client/**"
      - "ui/observability/**"
      - "ui/scripts/build/**"
      - "ui/index.html"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/tsconfig*.json"
      - "ui/vite.config.ts"
      - "ui/vitest.config.ts"
      - "engine/lib/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "ui/api/**"
      - "ui/client/**"
      - "ui/observability/**"
      - "ui/scripts/build/**"
      - "ui/index.html"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/tsconfig*.json"
      - "ui/vite.config.ts"
      - "ui/vitest.config.ts"
      - "engine/lib/**"
      - ".github/workflows/ui-tests.yml"

concurrency:
  group: ui-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run test suite
        run: npm run test

      - name: Production build
        run: npm run build
