name: Platform Tests

# Runs the platform/ Python test suite (engine + platform/tests). Added because it had NO
# runner at all - same failure shape as issue #194 which is why ui-tests.yml exists: tests
# existed locally but nothing ran them automatically.

# Self-included in both path filters on purpose: a gate that cannot run on its own PR
# ships unproven, which is how this workflow reached main with zero executions (#533).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/tests/**'
      - 'engine/**'
      - '.github/workflows/platform-tests.yml'
  pull_request:
    paths:
      - 'platform/tests/**'
      - 'engine/**'
      - '.github/workflows/platform-tests.yml'

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run test suite
        run: python3 -m unittest discover -s platform/tests -p "test_*.py"
