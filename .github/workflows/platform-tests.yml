name: Platform Tests

# Runs the platform/ Python test suite (engine + platform/tests). Added because it had NO
# runner at all - same failure shape as issue #194 which is why ui-tests.yml exists: tests
# existed locally but nothing ran them automatically.

on:
  push:
    branches: [main]
    paths:
      - 'platform/tests/**'
      - 'engine/**'
  pull_request:
    paths:
      - 'platform/tests/**'
      - 'engine/**'

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run test suite
        run: python3 -m unittest discover -s platform/tests -p "test_*.py"
