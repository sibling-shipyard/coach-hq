name: Platform Tests

# Runs the platform/ Python test suite (engine + platform/tests) and platform/skills/'s node:test
# suite. Added because it had NO runner at all - same failure shape as issue #194 which is why
# ui-tests.yml exists: tests existed locally (checks.conf) but nothing ran them automatically.
# #911 added platform/skills/sentry-digest.test.mjs to checks.conf without adding it here, so it
# only ran when someone remembered `check.sh` locally - this closes that gap.

# Self-included in both path filters on purpose: a gate that cannot run on its own PR
# ships unproven, which is how this workflow reached main with zero executions (#533).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/tests/**'
      - 'platform/skills/**'
      - 'engine/**'
      - '.github/workflows/platform-tests.yml'
  pull_request:
    paths:
      - 'platform/tests/**'
      - 'platform/skills/**'
      - 'engine/**'
      - '.github/workflows/platform-tests.yml'

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pip install requests

      - name: Run test suite
        run: python3 -m unittest discover -s platform/tests -p "test_*.py"

      - name: Run platform/skills tests
        run: node --test platform/skills/*.test.mjs
