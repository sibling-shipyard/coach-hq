name: Platform Tests

# Runs platform/ Python tests, platform/skills node:test, and engine/scripts Node + Python
# suites. Added because it had NO runner at all - same failure shape as issue #194. #911 added
# platform/skills/sentry-digest.test.mjs to checks.conf without adding it here. #1117 adds the
# engine/scripts suites the local gate already needed.

# Self-included in both path filters on purpose: a gate that cannot run on its own PR
# ships unproven, which is how this workflow reached main with zero executions (#533).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platform/tests/**'
      - 'platform/skills/**'
      - 'engine/**'
      - '.github/workflows/platform-tests.yml'
  pull_request:
    paths:
      - 'platform/tests/**'
      - 'platform/skills/**'
      - 'engine/**'
      - '.github/workflows/platform-tests.yml'

concurrency:
  group: platform-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pip install requests

      - name: Run test suite
        run: python3 -m unittest discover -s platform/tests -p "test_*.py"

      - name: Run platform/skills tests
        run: node --test platform/skills/*.test.mjs

      - name: Run engine Node tests
        run: node --test engine/scripts/*.test.mjs

      - name: Run engine Python tests
        run: python3 -m unittest discover -s engine/scripts -p "test_*.py"
