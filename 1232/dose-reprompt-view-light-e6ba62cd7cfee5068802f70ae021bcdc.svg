<title>Data flow — a violating routine gets one reprompt</title>
<desc>The progression dose invariants (unknown progression_id without scaled_from, dose above current) are extracted from applyWorkoutCreate into a shared pure check. The model reply now gets one reprompt naming the exact violation before the routine is finalized; if it still violates, Sentry records it and the athlete still gets the couldn't-save note.</desc>
