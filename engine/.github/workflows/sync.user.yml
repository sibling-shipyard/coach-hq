# User-repo sync (coach-skeleton / coach-<user>). iOS path only — the HealthKit app commits
# history directly, this just regenerates derived files (quest_log, quest_history, sync_status,
# gen/aggregate.json) on every push.

name: Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'user_data/activities/hist/**'
      - 'user_data/ledger/challenge_v2.json'
      - 'user_data/coach/sleep_log.json'

permissions:
  contents: write

# Serialize runs so two Sync jobs never race each other's push to main.
# cancel-in-progress:false — let an in-flight regen finish; queue the next.
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run pipeline
        run: python3 engine/scripts/regenerate_derived.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build aggregate
        run: node engine/scripts/build-aggregate.mjs --aggregate

      - name: Commit pipeline changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gen/aggregate.json
          git add gen/quest_log.md gen/quest_history.json gen/sync_status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            MSG=$(python3 -c "import json; print(json.load(open('gen/sync_status.json'))['commit_message'])" 2>/dev/null || echo "core: sync pipeline run [skip ci]")
            git commit -m "$MSG"
            # main may have advanced (e.g. an iOS hist/ push) between checkout and
            # now — rebase our single gen/ commit on top and retry before giving up.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "push still rejected after $attempt attempts" >&2
                exit 1
              fi
              echo "push rejected — rebasing on origin/main (attempt $attempt)"
              git pull --rebase --autostash origin main
            done
          fi
