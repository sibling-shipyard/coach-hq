# User-repo sync (coach-skeleton / coach-<user>). iOS path only — the HealthKit app commits
# history directly, this just regenerates derived files (quest_history, sync_status,
# dashboard_snapshot, athlete_insights) on every push. A run that dies instead commits
# gen/sync_failure.json — the record of why gen/ is stale. No surface reads it yet.

name: Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'user_data/activities/hist/**'
      - 'user_data/ledger/**'
      - 'user_data/coach/sleep_log.json'

permissions:
  contents: write

# Serialize runs so two Sync jobs never race each other's push to main.
# cancel-in-progress:false — let an in-flight regen finish; queue the next.
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        id: install_deps
        run: pip install requests

      - name: Find changed activities
        id: changed_activities
        if: github.event_name == 'push'
        run: |
          {
            echo 'CHANGED_ACTIVITY_PATHS<<EOF'
            git diff --name-only --diff-filter=AM '${{ github.event.before }}' '${{ github.sha }}' -- user_data/activities/hist/ || true
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Run pipeline
        id: run_pipeline
        run: python3 engine/scripts/regenerate_derived.py

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dashboard snapshot and athlete insights
        id: build_snapshot
        run: |
          node engine/scripts/build-dashboard-snapshot.mjs --dashboard-snapshot
          node engine/scripts/generate-athlete-insights.mjs

      - name: Commit pipeline changes
        id: commit_and_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add user_data/activities/hist/
          git add -f gen/dashboard_snapshot.json gen/athlete_insights.json
          git add gen/quest_history.json gen/sync_status.json
          rm -f gen/sync_failure.json
          git rm -q --cached --ignore-unmatch gen/sync_failure.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          MSG=$(python3 -c "import json; print(json.load(open('gen/sync_status.json'))['commit_message'])" 2>/dev/null || echo "core: regenerate derived data [skip ci]")
          git commit -m "$MSG"
          # Retry loop: on non-fast-forward, reset to origin/main and re-run the full
          # pipeline rather than rebasing — gen files are deterministic from activity
          # data, so regenerating on the new HEAD always produces a conflict-free commit.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected — re-running pipeline on origin/main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python3 engine/scripts/regenerate_derived.py
            git add user_data/activities/hist/
            node engine/scripts/build-dashboard-snapshot.mjs --dashboard-snapshot
            node engine/scripts/generate-athlete-insights.mjs
            git add -f gen/dashboard_snapshot.json gen/athlete_insights.json
            git add gen/quest_history.json gen/sync_status.json
            rm -f gen/sync_failure.json
            git rm -q --cached --ignore-unmatch gen/sync_failure.json
            if git diff --cached --quiet; then
              echo "No changes after re-run"
              exit 0
            fi
            MSG=$(python3 -c "import json; print(json.load(open('gen/sync_status.json'))['commit_message'])" 2>/dev/null || echo "core: regenerate derived data [skip ci]")
            git commit -m "$MSG"
          done
          echo "All push attempts failed"
          exit 1

      # A failed Sync leaves gen/ untouched, so every reader keeps serving the previous run's
      # numbers as if they were current. This writes the run's own gravestone. It cannot trust
      # anything the dead step left behind, so it re-derives its state from origin/main and
      # pushes that one file. Failing here would only hide the original failure, so it never
      # exits non-zero — it annotates and stops. `set +e` is what makes that true: GitHub runs
      # this block under `bash -e`, which would otherwise abort on a transient `git fetch` and
      # skip both the annotation and the retry.
      - name: Record sync failure
        if: failure()
        env:
          SYNC_STEPS_JSON: ${{ toJSON(steps) }}
          SYNC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_RUN_ID: ${{ github.run_id }}
          SYNC_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          if [ ! -d .git ]; then
            echo "::error::Sync failed before checkout — nowhere to record it. Run: $SYNC_RUN_URL"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! python3 engine/scripts/record_sync_failure.py; then
              echo "::error::Could not write the failure record. Run: $SYNC_RUN_URL"
              exit 0
            fi
            git add -f gen/sync_failure.json
            if git diff --cached --quiet; then
              echo "Failure record already current — nothing to commit"
              exit 0
            fi
            git commit -q -m "data: record failed sync run [skip ci]"
            git push && exit 0
            echo "push rejected — retrying the failure record (attempt $attempt)"
          done
          echo "::error::Sync failed and the failure record could not be pushed. Run: $SYNC_RUN_URL"
          exit 0
