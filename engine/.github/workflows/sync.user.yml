# User-repo sync (coach-skeleton / coach-<user>). HealthKit commits history directly;
# Coach also writes profile, ledger, and workout files. This regenerates derived files
# (quest_history, sync_status, dashboard_snapshot, athlete_insights, optional
# badminton analytics), reconciles
# current_week.json against newly-synced activities, and rolls it over once it ages
# out (ADR 0042) — on relevant data pushes. A run that dies
# instead commits gen/sync_failure.json — the record of why gen/ is stale — and alerts Sentry.

name: Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'user_data/activities/hist/**'
      - 'user_data/activities/match_history.json'
      - 'user_data/activities/workout_plans/templates/**'
      - 'user_data/activities/workout_plans/sessions/**'
      - 'user_data/ledger/**'
      - 'user_data/coach/profile.json'
      - 'user_data/coach/sleep_log.json'

permissions:
  contents: write

# Serialize runs so two Sync jobs never race each other's push to main.
# cancel-in-progress:false — let an in-flight regen finish; queue the next.
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        id: install_deps
        run: pip install requests

      - name: Find changed activities
        id: changed_activities
        if: github.event_name == 'push'
        run: |
          {
            echo 'CHANGED_ACTIVITY_PATHS<<EOF'
            git diff --name-only --diff-filter=AM '${{ github.event.before }}' '${{ github.sha }}' -- user_data/activities/hist/ || true
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Run pipeline
        id: run_pipeline
        run: python3 engine/scripts/regenerate_derived.py

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ADR 0042's deterministic reconciler: matches newly-synced activities to this week's
      # planned sessions with no model call. Only touches current_week.json when the result
      # passes parseCurrentWeek - a validation failure exits nonzero and leaves the file alone,
      # same as every other step below.
      - name: Reconcile current week
        id: reconcile_current_week
        run: ./engine/scripts/reconcile-current-week

      # ADR 0042's rollover: runs after reconciliation (so the old week's last real
      # activities get matched before it's replaced), and only ever acts on a week that's aged
      # out - a still-current live or placeholder week is left untouched. Fixes the "dark week"
      # bug: an athlete who never chats still gets a Current Week naming the real dates.
      - name: Roll over an aged-out current week
        id: rollover_current_week
        run: ./engine/scripts/rollover-current-week

      - name: Build dashboard snapshot and athlete insights
        id: build_snapshot
        run: |
          node engine/scripts/build-dashboard-snapshot.mjs --dashboard-snapshot
          node engine/scripts/generate-athlete-insights.mjs

      - name: Commit pipeline changes
        id: commit_and_push
        run: |
          # Stage the athlete's activity history. Two states break a plain `git add` here and
          # they need different handling, which is why this is a function and not one flag:
          #   - the carved .gitignore lists user_data/activities/hist/, so a file sitting there
          #     untracked is refused (exit 1) without -f;
          #   - on a fresh carve the directory does not exist at all, and `git add` on a missing
          #     pathspec is a fatal 128 that -f does not change.
          # Real history arrives already tracked: iOS commits it through the Git Data API, which
          # does not consult .gitignore. So this stages the same files it always did.
          add_history() {
            hist=user_data/activities/hist
            [ -d "$hist" ] || return 0
            [ -n "$(ls -A "$hist" 2>/dev/null)" ] || return 0
            git add -f "$hist/"
          }
          add_current_week() {
            week=user_data/ledger/current_week.json
            [ -f "$week" ] || return 0
            git add "$week"
          }
          stage_badminton_analytics() {
            snapshot=gen/badminton_analytics_snapshot.json
            if [ -f "$snapshot" ]; then
              git add -f "$snapshot"
            else
              git rm -q --cached --ignore-unmatch "$snapshot"
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          add_history
          add_current_week
          git add -f gen/dashboard_snapshot.json gen/athlete_insights.json
          git add gen/quest_history.json gen/sync_status.json
          stage_badminton_analytics
          rm -f gen/sync_failure.json
          git rm -q --cached --ignore-unmatch gen/sync_failure.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          MSG=$(python3 -c "import json; print(json.load(open('gen/sync_status.json'))['commit_message'])" 2>/dev/null || echo "core: regenerate derived data [skip ci]")
          git commit -m "$MSG"
          # Retry loop: on non-fast-forward, reset to origin/main and re-run the full
          # pipeline rather than rebasing — gen files are deterministic from activity
          # data, so regenerating on the new HEAD always produces a conflict-free commit.
          # The reconciler is the same: it only ever acts on current_week.json's own planned
          # sessions plus synced activity data, so re-running it against origin/main's fresh
          # current_week.json is exactly as safe as regenerating the gen/ files is.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected — re-running pipeline on origin/main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python3 engine/scripts/regenerate_derived.py
            add_history
            ./engine/scripts/reconcile-current-week
            ./engine/scripts/rollover-current-week
            node engine/scripts/build-dashboard-snapshot.mjs --dashboard-snapshot
            node engine/scripts/generate-athlete-insights.mjs
            add_current_week
            git add -f gen/dashboard_snapshot.json gen/athlete_insights.json
            git add gen/quest_history.json gen/sync_status.json
            stage_badminton_analytics
            rm -f gen/sync_failure.json
            git rm -q --cached --ignore-unmatch gen/sync_failure.json
            if git diff --cached --quiet; then
              echo "No changes after re-run"
              exit 0
            fi
            MSG=$(python3 -c "import json; print(json.load(open('gen/sync_status.json'))['commit_message'])" 2>/dev/null || echo "core: regenerate derived data [skip ci]")
            git commit -m "$MSG"
          done
          echo "All push attempts failed"
          exit 1

      # A failed Sync leaves gen/ untouched, so every reader keeps serving the previous run's
      # numbers as if they were current. This writes the run's own gravestone. It cannot trust
      # anything the dead step left behind, so it re-derives its state from origin/main and
      # pushes that one file. Failing here would only hide the original failure, so it never
      # exits non-zero — it annotates and stops. It also sends one Sentry event, because a file
      # in the repo is only read by someone who already suspects something is wrong. `set +e` is
      # what makes the never-fail promise true: GitHub runs this block under `bash -e`, which
      # would otherwise abort on a transient `git fetch` and skip the annotation and the retries.
      - name: Record sync failure
        if: failure()
        env:
          SYNC_STEPS_JSON: ${{ toJSON(steps) }}
          SYNC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_RUN_ID: ${{ github.run_id }}
          SYNC_RUN_ATTEMPT: ${{ github.run_attempt }}
          SYNC_ATHLETE_ID: ${{ github.repository_owner }}
          # Stamped in at carve time by platform/scripts/carve-skeleton.mjs. A Sentry DSN
          # only writes — it cannot read an event back — so it is not a secret and the athlete
          # sets nothing. Empty here means no alert; the record file below is still written.
          SENTRY_DSN: ""
        run: |
          set +e
          # First, and behind `||`: the alert is the half that reaches a human, and it is the
          # only half that still works when this job cannot push. It exits 0 on every internal
          # failure; the `||` covers the case where checkout died and the script is not there.
          python3 engine/scripts/notify_sync_failure.py \
            || echo "::warning::Could not alert Sentry about this failed Sync. Run: $SYNC_RUN_URL"
          if [ ! -d .git ]; then
            echo "::error::Sync failed before checkout — nowhere to record it. Run: $SYNC_RUN_URL"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! python3 engine/scripts/record_sync_failure.py; then
              echo "::error::Could not write the failure record. Run: $SYNC_RUN_URL"
              exit 0
            fi
            git add -f gen/sync_failure.json
            if git diff --cached --quiet; then
              echo "Failure record already current — nothing to commit"
              exit 0
            fi
            git commit -q -m "data: record failed sync run [skip ci]"
            git push && exit 0
            echo "push rejected — retrying the failure record (attempt $attempt)"
          done
          echo "::error::Sync failed and the failure record could not be pushed. Run: $SYNC_RUN_URL"
          exit 0
