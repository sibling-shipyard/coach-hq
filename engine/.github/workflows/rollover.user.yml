# Keep an athlete repo's current week fresh even when no one has pushed data or opened Coach.
name: Daily current-week rollover

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

# Sync and rollover both write current_week.json. Share the lock so a scheduled run cannot
# race a data-triggered Sync run and publish an older week over a newer one.
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Roll over an aged-out current week
        id: rollover_current_week
        run: |
          ./engine/scripts/rollover-current-week
          if git diff --quiet -- user_data/ledger/current_week.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Current week is still current; skipping derived-data build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dashboard snapshot and athlete insights
        id: build_snapshot
        if: steps.rollover_current_week.outputs.changed == 'true'
        run: |
          node engine/scripts/build-dashboard-snapshot.mjs --dashboard-snapshot
          node engine/scripts/generate-athlete-insights.mjs

      - name: Commit current-week rollover and derived data
        id: commit_and_push
        if: steps.rollover_current_week.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add user_data/ledger/current_week.json
          git add -f gen/dashboard_snapshot.json gen/athlete_insights.json
          git commit -m "data: roll over current week [skip ci]"
          git push

      # A failed rollover leaves the previous current week and derived readers in place. Use
      # the same alert and gravestone path as Sync so an operator can find the failed run.
      - name: Record rollover failure
        if: failure()
        env:
          SYNC_STEPS_JSON: ${{ toJSON(steps) }}
          SYNC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_RUN_ID: ${{ github.run_id }}
          SYNC_RUN_ATTEMPT: ${{ github.run_attempt }}
          SYNC_ATHLETE_ID: ${{ github.repository_owner }}
          SYNC_OPERATION: rollover
          # Stamped in at carve time by platform/scripts/carve-skeleton.mjs.
          SENTRY_DSN: ""
        run: |
          set +e
          python3 engine/scripts/notify_sync_failure.py \
            || echo "::warning::Could not alert Sentry about this failed rollover. Run: $SYNC_RUN_URL"
          if [ ! -d .git ]; then
            echo "::error::Rollover failed before checkout — nowhere to record it. Run: $SYNC_RUN_URL"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! python3 engine/scripts/record_sync_failure.py; then
              echo "::error::Could not write the rollover failure record. Run: $SYNC_RUN_URL"
              exit 0
            fi
            git add -f gen/sync_failure.json
            if git diff --cached --quiet; then
              echo "Failure record already current — nothing to commit"
              exit 0
            fi
            git commit -q -m "data: record failed rollover run [skip ci]"
            git push && exit 0
            echo "push rejected — retrying the rollover failure record (attempt $attempt)"
          done
          echo "::error::Rollover failed and the failure record could not be pushed. Run: $SYNC_RUN_URL"
          exit 0
