name: Validate SOUL composition

# SOUL.md is generated from soul/ via scripts/compose-soul.mjs (flat layout in user repos).

on:
  push:
    branches: [main]
    paths:
      - 'SOUL.md'
      - 'soul/**'
      - 'scripts/compose-soul.mjs'
  pull_request:
    paths:
      - 'SOUL.md'
      - 'soul/**'
      - 'scripts/compose-soul.mjs'

jobs:
  validate-soul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert SOUL.md matches composed output
        run: node scripts/compose-soul.mjs --check
