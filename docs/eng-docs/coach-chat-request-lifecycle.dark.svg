<text x="535.1" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1" text-anchor="middle">semantic actions → validated writes</text>
<rect x="405.6" y="426.0" width="259.0" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
