<text x="535.1" y="468.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1" text-anchor="middle">commitFilesAtomic · one commit per turn</text>
<rect x="769.4" y="262.0" width="288.6" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="913.7" y="284.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">athlete repo</text>
<text x="913.7" y="304.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1" text-anchor="middle">chat_history.json + split records (ADR 0012)</text>
<text x="24" y="528.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">Stage order grepped from handle() in ui/api/coach-chat.ts: parse → loadTurnState → requestCoachReply → buildTurnWrites → commitTurn.</text>
<text x="24" y="546.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">Response-time cap: pruneForResponse slices the newest 7 threads (MAX_RETAINED_THREADS) in chatThreads.ts; storage retains every thread (ADR 0037).</text>
<text x="24" y="564.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">activity_sync batch id = first 16 hex of sha256 over sorted unique activity ids (activitySync.ts); missing hist files → 422; duplicate set → duplicate:true, no second LLM call.</text>
<text x="24" y="582.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">Provider is resolved per request (resolveProviderName): OpenRouter when LLM_PROVIDER=openrouter, else Gemini — so the LLM is not always Gemini.</text>
</svg>