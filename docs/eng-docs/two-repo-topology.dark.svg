<text x="24" y="774.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">Never carved: platform/SOUL.chat.md (hosted chat path stays HQ-side), ui/, ios/, kdb/, .github/agents/, plugins, platform/soul/ layers, compose-soul.mjs — per script header + docs/eng-docs/skeleton-layout.md.</text>
<text x="24" y="792.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">HQ user_data/ and gen/ are NEVER copied — the athlete repo&#x27;s user_data/ and gen/ are generated from the script&#x27;s seed templates only.</text>
<text x="24" y="810.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">sync.user.yml → sync.yml and rollover.user.yml → rollover.yml are the only files the carve rewrites; the renamed sync.yml filename is a contract with the iOS app (GitHubAPIClient.syncWorkflowRun(headSHA:) requests /actions/workflows/sync.yml/runs).</text>
<text x="24" y="828.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">Carve fails closed without SENTRY_DSN unless --no-sentry is passed; the DSN is operator-exported at carve time, never committed.</text>
