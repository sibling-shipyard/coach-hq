<text x="2317.5" y="263.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e" text-anchor="middle">never emulates the Gemini cache (concatenates prefix+system); remaps model→assistant roles; WHERE the schema is enforced: json_schema strict:true; WHERE its retry lives: 1× on finish_reason=length; real costUsd + cached tokens in usage</text>
<rect x="3227.0" y="139.0" width="780.2" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
