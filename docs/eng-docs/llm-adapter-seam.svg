<text x="3617.1" y="181.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e" text-anchor="middle">x-goog-api-key header; model gemini-pro-latest (ui/api/_lib/geminiModel.ts); responseSchema + responseMimeType application/json</text>
<rect x="3283.3" y="221.0" width="667.7" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
