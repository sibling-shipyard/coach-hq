<text x="2317.5" y="181.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e" text-anchor="middle">WHERE the cache lives: tries geminiSoulCache.ts; WHERE retries live: 1× on stale-cache 400 (invalidate + no-cache) or 503/504 (500ms backoff), gated on cachePrefix; strips additionalProperties recursively; MAX_TOKENS guard + no-content guard; usage into Sentry gen_ai span</text>
<rect x="1607.5" y="221.0" width="1419.9" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
