<text x="3617.1" y="263.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e" text-anchor="middle">model google/gemini-3.8-flash; provider.only google-vertex, data_collection deny (ZDR); reasoning effort low</text>
<text x="24" y="364.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">The adapter returns raw JSON text; the caller parses and validates it — JSON.parse + LlmReply in coachLlmClient (with one ≤20s JSON-parse retry), {body} shape check in generateProactiveBody.</text>
<text x="24" y="382.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">All claims verified by grep against main on 2026-09-18.</text>
