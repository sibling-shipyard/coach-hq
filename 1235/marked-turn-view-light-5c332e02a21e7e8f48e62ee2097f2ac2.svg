<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1951 299" width="1951" height="299" role="img" aria-label="Data flow — a cache-marked turn" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Data flow — a cache-marked turn</title>
<desc>Coach chat tells OpenRouter where its stable prompt prefix ends: toOpenRouterMessages now emits the leading system message as two content blocks — the cachePrefix tagged cache_control {type: &quot;ephemeral&quot;}, then the per-turn system text — instead of one concatenated string. A llm.cache_marker span attribute lets Sentry split marked from unmarked calls, and a new failure-path test proves a provider 400 on the new shape reaches captureLlmFailure from both callers.</desc>
