<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2076 375" width="2076" height="375" role="img" aria-label="Data flow — a claimed-but-unwritten week change" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>Data flow — a claimed-but-unwritten week change</title>
<desc>A this-week or named-day schedule change that the reply claims was made but never wrote a week_update now gets the same one-shot reprompt, honest correction and Sentry detector as the sibling missed-language guards. The session_plan guard also tightens: a bare &quot;I set today's session&quot; counts as a done-claim, &quot;not just today&quot; no longer trips the today-only guard, and permanent wording defers to the template_edit guard.</desc>
