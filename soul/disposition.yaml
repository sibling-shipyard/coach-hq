# disposition.yaml — dispositioned line accounting over the frozen v5.7 SOUL reference.
#
# Every line of soul/SOUL.v5.7.frozen.md is dispositioned exactly once. The union of all
# entry line-ranges equals lines 1..447 with no line claimed twice (Gate 2, design doc §6.3).
# Each entry carries a stable rule-ID and resolves to an anchor in its target layer (A/B/C).
# Clause-level entries (SPLIT) are used only where a line genuinely spans layers — §5, §8, §9.
#
# disposition:
#   A | B | C        — moved to that layer unchanged                (requires: anchor)
#   REWRITTEN        — transformed: verb, path remap, or noun swap  (requires: anchor, reason)
#   SPLIT            — clause spans layers                          (requires: anchors[]; optional dropped[])
#   DROPPED          — removed                                      (requires: reason)
#
# Anchors are stable IDs in the source, not line numbers — ordinary edits don't churn them.
# In P1 anchors resolve against the stub registry soul/anchors.registry.txt; P3/P4 make them live.

