<title>Coach Phelps HQ</title>
<style>
  :root{
    --paper:#E7E2D2; --block-top:#F2EEE0; --block-right:#D8D2BE; --block-left:#C3BCA5;
    --slab-top:#EDE4CF; --slab-right:#D6CBAE; --slab-left:#C0B497;
    --ink:#262B24; --ink-soft:#5B6156; --accent:#0E7C86; --accent-soft:#BFE0DF;
    --line:#9B9483; --alert:#B5502E; --panel:#F7F4E9; --rail:#EFE9D8;
    --shadow: rgba(38,43,36,0.18);
    --col-soul:#F1E6C2; --col-soul-edge:#DFCF9E;
    --col-dashboard:#D9E5EE; --col-dashboard-edge:#BBD0E0;
    --col-api:#CDE8E4; --col-api-edge:#A9D4CD;
    --col-engine:#DEE8D3; --col-engine-edge:#C1D4AF;
    --col-ios:#E5DEED; --col-ios-edge:#CBBEDD;
    --col-ci:#E6E2D6; --col-ci-edge:#CFC8B3;
    --col-store:#EEDFC0; --col-store-edge:#DCC495;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1D18; --block-top:#2B2E27; --block-right:#232620; --block-left:#1A1C17;
      --slab-top:#2A2D25; --slab-right:#212420; --slab-left:#181A16;
      --ink:#EDE8D8; --ink-soft:#A9A190; --accent:#4FC6C2; --accent-soft:#1F3C3C;
      --line:#43473C; --alert:#E38A63; --panel:#20221D; --rail:#1D1F1A;
      --shadow: rgba(0,0,0,0.45);
      --col-soul:#3B331E; --col-soul-edge:#544825;
      --col-dashboard:#1F2A32; --col-dashboard-edge:#2C3E4A;
      --col-api:#1A302C; --col-api-edge:#23453D;
      --col-engine:#232C1D; --col-engine-edge:#334227;
      --col-ios:#2A2432; --col-ios-edge:#3B3247;
      --col-ci:#292720; --col-ci-edge:#3A372C;
      --col-store:#332813; --col-store-edge:#4A3A1A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1D18; --block-top:#2B2E27; --block-right:#232620; --block-left:#1A1C17;
    --slab-top:#2A2D25; --slab-right:#212420; --slab-left:#181A16;
    --ink:#EDE8D8; --ink-soft:#A9A190; --accent:#4FC6C2; --accent-soft:#1F3C3C;
    --line:#43473C; --alert:#E38A63; --panel:#20221D; --rail:#1D1F1A;
    --shadow: rgba(0,0,0,0.45);
    --col-soul:#3B331E; --col-soul-edge:#544825;
    --col-dashboard:#1F2A32; --col-dashboard-edge:#2C3E4A;
    --col-api:#1A302C; --col-api-edge:#23453D;
    --col-engine:#232C1D; --col-engine-edge:#334227;
    --col-ios:#2A2432; --col-ios-edge:#3B3247;
    --col-ci:#292720; --col-ci-edge:#3A372C;
    --col-store:#332813; --col-store-edge:#4A3A1A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .mono{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; }
  ::selection{ background:var(--accent-soft); }
  a{ color:var(--accent); }
  button:focus-visible, .rail-item:focus-visible, .tab:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:stretch; gap:0; flex-shrink:0;
    border-bottom:1px solid var(--line); background:var(--rail);
  }
  .stat{
    padding:10px 18px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; justify-content:center; gap:3px; min-width:0;
  }
  .stat-label{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:9.5px; letter-spacing:.09em; color:var(--ink-soft); text-transform:uppercase; white-space:nowrap;}
  .stat-value{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stat-value b{ font-weight:700; }
  .topbar-fill{ flex:1; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; padding:0 14px; }
  .btn{
    font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    background:var(--block-top); color:var(--ink); border:1px solid var(--line);
    padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .btn[aria-pressed="true"]{ background:var(--accent); color:var(--panel); border-color:var(--accent); }

  /* ---------- Body layout ---------- */
  .body{ flex:1; display:flex; min-height:0; }
  .rail{
    width:212px; flex-shrink:0; background:var(--rail); border-right:1px solid var(--line);
    overflow-y:auto; padding:10px 0 20px;
  }
  .rail-group-label{
    font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    font-size:9.5px; letter-spacing:.09em; color:var(--ink-soft); text-transform:uppercase;
    padding:12px 14px 5px;
  }
  .rail-item{
    display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    background:none; border:none; padding:5px 14px; cursor:pointer; color:var(--ink);
  }
  .rail-item:hover, .rail-item.hover{ background:var(--accent-soft); }
  .rail-item.pinned{ background:var(--accent); color:var(--panel); }
  .rail-code{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:11px; font-weight:700; width:20px; flex-shrink:0; }
  .rail-name{ font-size:12px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-loc{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:9.5px; color:var(--ink-soft); flex-shrink:0; }
  .rail-item.pinned .rail-loc{ color:var(--panel); opacity:.8; }

  .stage{ flex:1; position:relative; min-width:0; background:var(--paper); overflow:hidden; }
  #canvas{ width:100%; height:100%; display:block; cursor:grab; }
  #canvas.panning{ cursor:grabbing; }

  .zoom-controls{ position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:1px; z-index:5;}
  .zoom-controls button{
    width:30px; height:30px; font-size:16px; line-height:1; background:var(--block-top);
    border:1px solid var(--line); color:var(--ink); cursor:pointer;
  }
  .zoom-controls button:hover{ background:var(--accent-soft); }

  .breadcrumb{
    position:absolute; top:14px; left:14px; z-index:5;
    font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:11px;
    background:var(--block-top); border:1px solid var(--line); padding:6px 10px;
    display:none; align-items:center; gap:8px; color:var(--ink);
  }
  .breadcrumb.show{ display:flex; }
  .breadcrumb button{ background:none; border:none; color:var(--accent); cursor:pointer; font:inherit; padding:0; text-decoration:underline; }

  .trace-banner{
    position:absolute; left:14px; right:14px; bottom:14px; z-index:5;
    background:var(--panel); border:1px solid var(--accent); padding:10px 14px;
    display:none; gap:10px; align-items:baseline; box-shadow:0 2px 10px var(--shadow);
  }
  .trace-banner.show{ display:flex; }
  .trace-step{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:11px; color:var(--accent); flex-shrink:0; }
  .trace-text{ font-size:13px; line-height:1.5; }

  .footer-hint{
    position:absolute; left:14px; bottom:14px; z-index:4;
    font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:10px;
    color:var(--ink-soft); letter-spacing:.03em;
  }

  .legend{
    position:absolute; right:14px; bottom:14px; z-index:4;
    background:var(--block-top); border:1px solid var(--line); padding:8px 11px;
    display:flex; flex-direction:column; gap:5px;
  }
  .legend-row{ display:flex; align-items:center; gap:7px; font-size:10px; color:var(--ink-soft); white-space:nowrap; }
  .legend-row svg{ flex-shrink:0; }

  .tip{
    position:fixed; z-index:20; pointer-events:none;
    background:var(--ink); color:var(--paper); font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    font-size:11px; padding:5px 8px; max-width:240px; display:none; line-height:1.4;
  }
  .tip b{ font-weight:700; }

  .colony-top, .colony-side{ pointer-events:none; }
  .colony-label{
    font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:9px; letter-spacing:.1em;
    fill:var(--ink-soft); text-transform:uppercase; pointer-events:none;
  }
  .colony-label-bg{ fill:var(--panel); opacity:0.86; stroke:var(--line); stroke-width:0.6; pointer-events:none; }

  .trace-fx-dot{ fill:var(--alert); stroke:var(--panel); stroke-width:1.5; }

  /* ---------- Panel ---------- */
  .panel{
    width:340px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .tabs{ display:flex; border-bottom:1px solid var(--line); flex-shrink:0; }
  .tab{
    flex:1; font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; text-align:center;
    padding:12px 4px; background:none; border:none; color:var(--ink-soft); cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .panel-scroll{ flex:1; overflow-y:auto; padding:20px; }
  .panel-eyebrow{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:10px; letter-spacing:.09em; color:var(--accent); text-transform:uppercase; margin-bottom:6px;}
  .panel-title{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:19px; font-weight:700; line-height:1.25; margin:0 0 4px; text-wrap:balance; }
  .panel-sub{ font-size:13px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5; }
  .panel-meta{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:14px; }
  .panel-body p{ font-size:13px; line-height:1.65; margin:0 0 13px; }
  .panel-body p:last-child{ margin-bottom:0; }
  .panel-hl{ background:var(--accent-soft); padding:0 3px; }
  .panel-hr{ border:none; border-top:1px solid var(--line); margin:18px 0; }
  .panel-section-label{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; font-size:10px; letter-spacing:.09em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px; }
  .talks-list{
    list-style:none; margin:0; padding:0; font-size:12.5px;
    display:grid; grid-template-columns:124px 1fr; column-gap:14px;
  }
  .talks-list li{ display:contents; }
  .talks-list button, .talks-list .talk-pay{
    padding:7px 0; border-bottom:1px dotted var(--line); line-height:1.45;
    display:flex; align-items:center;
  }
  .talks-list button{ background:none; border:none; border-bottom:1px dotted var(--line); color:var(--accent); cursor:pointer; font:inherit; text-align:left; }
  .talks-list .talk-pay{ color:var(--ink-soft); }
  .talks-list li:last-child button, .talks-list li:last-child .talk-pay{ border-bottom:none; }
  .pin-x{ background:var(--accent); color:var(--panel); border:none; font-family:ui-monospace,monospace; font-size:11px; padding:4px 9px; cursor:pointer; margin-top:10px; }

  svg text{ font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; user-select:none; }
  .struct{ cursor:pointer; }
  .face{ stroke:var(--ink); stroke-width:1; stroke-linejoin:round; }
  .struct .code-label{ font-size:11.5px; font-weight:700; fill:var(--ink); text-anchor:middle; }
  .struct .loc-label{ font-size:7.5px; fill:var(--ink-soft); text-anchor:middle; }
  .struct.hover .face-top, .struct.pinned .face-top{ filter:brightness(1.06); }
  .struct.hover .face, .struct.pinned .face{ stroke:var(--accent); stroke-width:1.8; }
  .struct.dim{ opacity:.28; }
  .struct.trace-active .face{ stroke:var(--accent); stroke-width:2.4; }
  .struct.trace-active .code-label{ fill:var(--accent); }

  .edge-line{ fill:none; stroke:var(--line); stroke-width:1.1; }
  .edge-line.dashed{ stroke-dasharray:3 3; }
  .edge-hit{ fill:none; stroke:transparent; stroke-width:11; cursor:default; }
  .edge-dot{ fill:var(--accent); }
  .external-label{ font-size:9.5px; fill:var(--ink-soft); letter-spacing:.05em; }
  .external-leader{ stroke:var(--ink-soft); stroke-dasharray:2 3; stroke-width:1; fill:none; }
  .external.trace-active .external-label{ fill:var(--accent); font-weight:700; }
  .external.dim{ opacity:.3; }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration:0.001s !important; }
  }

  @media (max-width: 900px){
    .rail{ width:150px; }
    .panel{ width:280px; }
    .stat-label{ display:none; }
  }
</style>
<script>
(function(){
  try{
    var t = localStorage.getItem('atlas-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){
    document.documentElement.setAttribute('data-theme','light');
  }
})();
</script>

<div class="topbar" id="topbar">
  <div class="topbar-fill" style="display:flex;"></div>
  <div class="topbar-actions">
    <button class="btn" id="btnTheme">☀ Light</button>
    <button class="btn" id="btnPause" aria-pressed="false">Pause the flow</button>
    <button class="btn" id="btnTraceBack">◀ Back</button>
    <button class="btn" id="btnTrace">Trace one step ▶</button>

</div>

<div class="body">
  <nav class="rail" id="rail" aria-label="Repository structure"></nav>

  <div class="stage" id="stage">
    <div class="breadcrumb" id="breadcrumb"></div>
    <svg id="canvas" viewBox="-403 -345 1150 955" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Isometric architecture map of Coach Phelps HQ">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="1"></line>
        </pattern>
        <pattern id="crosshatch" width="7" height="7" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="7" y2="7" stroke="var(--line)" stroke-width="0.9"></line>
          <line x1="7" y1="0" x2="0" y2="7" stroke="var(--line)" stroke-width="0.9"></line>
        </pattern>
        <pattern id="bggrid" width="34" height="34" patternUnits="userSpaceOnUse">
          <path d="M34 0 L0 0 0 34" fill="none" stroke="var(--line)" stroke-width="0.6" opacity="0.35"></path>

        <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">

      </defs>
      <rect id="bgrect" x="-3000" y="-3000" width="6000" height="6000" fill="url(#bggrid)"></rect>

    <div class="zoom-controls">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">&minus;</button>

      <div class="legend-row"><svg width="20" height="8" viewBox="0 0 20 8"><line x1="0" y1="4" x2="20" y2="4" stroke="var(--accent)" stroke-width="1.4"></line><circle cx="8" cy="4" r="2.4" fill="var(--accent)"></circle></svg><span>data in motion, live at request time</span></div>
      <div class="legend-row"><svg width="20" height="8" viewBox="0 0 20 8"><line x1="0" y1="4" x2="20" y2="4" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 3"></line></svg><span>wired at build time / config only</span></div>
      <div class="legend-row"><svg width="14" height="10" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"></path></svg><span>arrow points at the receiver</span></div>
    </div>
    <div class="footer-hint">HOVER TO READ &middot; CLICK TO PIN &middot; DOUBLE-CLICK TO GO INSIDE &middot; DRAG TO PAN &middot; SCROLL TO ZOOM</div>
  </div>

  <aside class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="what">What it does</button>

    <div class="panel-scroll" id="panelScroll"></div>
  </aside>
</div>

<script>
(function(){
"use strict";

/* ============================== DATA ============================== */

var GROUPS = [
  {id:'soul', label:'The Soul', short:'SOUL'},
  {id:'dashboard', label:'The Dashboard', short:'DASHBOARD'},
  {id:'api', label:'The Coach-Chat API', short:'COACH-CHAT API'},
  {id:'engine', label:'The Engine', short:'ENGINE'},
  {id:'ios', label:'The iOS App', short:'IOS APP'},
  {id:'ci', label:'CI & Governance', short:'CI & GOVERNANCE'},
  {id:'store', label:'The Data Store', short:'DATA STORE'}
];

var STRUCTURES = [
  { id:'SL', code:'SL', name:'Soul Composition', group:'soul', loc:'3 layers · 1,062 ln', gx:9, gy:0, w:2, d:2, h:6,
    what:"Three hand-written layers — coach identity, engine rules, athlete schema — get deterministically concatenated into platform/SOUL.md, the coach's entire personality and rulebook in one file.",
    how:"A Node script (compose-soul.mjs) concatenates platform/soul/A_identity.md, B_engine.md and C_athlete.md with section markers. CI (validate-soul.yml) fails any PR where SOUL.md drifts from its sources.",
    children:[
      {code:'A', name:'A_identity.md', h:3, what:'Coach Phelps’ voice, tone, and the six coaching rules — 84 lines.'},
      {code:'B', name:'B_engine.md', h:6, what:'Boot sequence, workflows, the commit protocol — the rules engine, 400 lines.'},
      {code:'C', name:'C_athlete.md', h:2, what:'Declarative athlete schema: sports[], injury_flags[], conditions[] — 69 lines.'},
      {code:'MD', name:'SOUL.md (composed)', h:5, what:'509-line output, ~12,400 tokens — read directly by the coach-chat backend.'}
    ]},

  { id:'UI', code:'UI', name:'Dashboard Client', group:'dashboard', loc:'145 files · 19.7K ln', gx:2, gy:0, w:3, d:2, h:14,
    what:"The athlete-facing web app — quest home, monthly and sport analytics, workout timer, and the Coach Chat tab. Built with React 19 and Vite, shipped as a static site on Vercel.",
    how:"ui/client/src: 18 pages, 91 components, Radix UI + Tailwind 4 + Recharts. Build-time data comes from shared/golden-dataset (HQ) or a synced athlete repo, injected by build-data.mjs." },

  { id:'WI', code:'TOK', name:'Design Tokens', group:'dashboard', loc:'2 files', gx:0, gy:1, w:1, d:1, h:2,
    what:"One shared set of colors and spacing — the “Warm Instrument” system — so the web dashboard and the native iOS app read as the same product.",
    how:"shared/warm-instrument/tokens.json generates CSS custom properties for the web build; iOS reads the same values from a mapping doc by hand — no generated Swift file yet." },

  { id:'GD', code:'GD', name:'Golden Dataset', group:'dashboard', loc:'6 files', gx:0, gy:3, w:1, d:1, h:1.4, slab:true,
    what:"Synthetic sample training data — the fixture HQ's own dashboard build runs on, since this repo carries no real athlete data by design.",
    how:"shared/golden-dataset/*.json, copied into ui/client/src/data at build time in place of a real synced repo." },

  { id:'BD', code:'BD', name:'Build Scripts', group:'dashboard', loc:'8 files', gx:1, gy:2, w:1, d:1, h:3,
    what:"The pre-build pipeline that stitches everything else together before the dashboard or its API functions ship — pulling in data, bundling SOUL.md, bundling the widget generator.",
    how:"ui/scripts/*.mjs, run via npm run predev / prebuild: build-data.mjs, build-soul.mjs, bundle-widget-snapshots-api.mjs, plus the coach-chat eval harness." },

  { id:'CC', code:'CC', name:'Coach Chat', group:'api', loc:'3 routes · 1,349 ln', gx:7, gy:3, w:3, d:3, h:11,
    what:"The actual coaching conversation. Every chat turn — web or iOS — lands here: it loads the athlete's context, asks Gemini for a reply, and on session close, writes the coach's memory back to the athlete's repo.",
    how:"ui/api/coach-chat.ts — 1,271 lines, the single largest file in the repo — is one Vercel serverless function. No separate chat server exists.",
    children:[
      {code:'CH', name:'coach-chat.ts', h:9, what:'Main handler: auth, context load, Gemini call, close-detection, response — 1,271 lines.'},
      {code:'CX', name:'coach-chat-context.ts', h:2, what:'Fire-and-forget cache warmer, fired when the chat tab opens.'},
      {code:'PS', name:'coach-chat-profile-status.ts', h:2, what:'Checks whether First Session intake is complete before the client shows the chat tab.'},
      {code:'LIB', name:'_lib file writer', h:5, what:'Shared commit / auth / cache helpers — see the File Writer block.'}
    ]},

  { id:'FW', code:'FW', name:'File Writer', group:'api', loc:'4 files · 644 ln', gx:11, gy:4, w:1, d:1, h:5,

var TILE_W = 39, TILE_H = 21, H_SCALE = 23;
function pg(gx, gy){ return { x:(gx-gy)*TILE_W, y:(gx+gy)*TILE_H }; }
function corners(s){
  var g0=pg(s.gx,s.gy), g1=pg(s.gx+s.w,s.gy), g2=pg(s.gx+s.w,s.gy+s.d), g3=pg(s.gx,s.gy+s.d);
  var hs = s.h*H_SCALE;
  return {
    g0:g0, g1:g1, g2:g2, g3:g3,
    t0:{x:g0.x,y:g0.y-hs}, t1:{x:g1.x,y:g1.y-hs}, t2:{x:g2.x,y:g2.y-hs}, t3:{x:g3.x,y:g3.y-hs}
  };
}
function anchorPt(s){ var c=corners(s); return { x:(c.t0.x+c.t2.x)/2, y:(c.t0.y+c.t2.y)/2 }; }
function inset(s, m){ return { gx:s.gx+m, gy:s.gy+m, w:Math.max(0.3,s.w-2*m), d:Math.max(0.3,s.d-2*m), h:s.h }; }
function pts(list){ return list.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' '); }

function svgEl(tag, attrs){

}

function renderStructure(s, container){
  var c = corners(inset(s, 0.16));
  var g = svgEl('g', {class:'struct', 'data-id':s.id});
  var topFill = s.slab ? 'var(--slab-top)' : 'var(--block-top)';
  var rightFill = s.slab ? 'var(--slab-right)' : 'var(--block-right)';
  var leftFill = s.slab ? 'var(--slab-left)' : 'var(--block-left)';
  var hatchPattern = s.slab ? 'url(#crosshatch)' : 'url(#hatch)';

  var left = svgEl('polygon', {class:'face face-left', points: pts([c.g2,c.g3,c.t3,c.t2]), fill:leftFill});
  var right = svgEl('polygon', {class:'face face-right', points: pts([c.g1,c.g2,c.t2,c.t1]), fill:rightFill});
  var top = svgEl('polygon', {class:'face face-top', points: pts([c.t0,c.t1,c.t2,c.t3]), fill:topFill});
  var topHatch = svgEl('polygon', {points: pts([c.t0,c.t1,c.t2,c.t3]), fill:hatchPattern, opacity:'0.55', style:'pointer-events:none;'});

  g.appendChild(left); g.appendChild(right); g.appendChild(top); g.appendChild(topHatch);

function edgeAnchor(id){

  }

}

function renderEdge(edge, container){
  var from = edgeAnchor(edge.f), to = edgeAnchor(edge.t);
  var midx = (from.x+to.x)/2;
  var d = 'M '+from.x.toFixed(1)+','+from.y.toFixed(1)+
          ' L '+midx.toFixed(1)+','+from.y.toFixed(1)+
          ' L '+midx.toFixed(1)+','+to.y.toFixed(1)+
          ' L '+to.x.toFixed(1)+','+to.y.toFixed(1);
  var line = svgEl('path', {class:'edge-line'+(edge.dashed?' dashed':''), d:d,
    'marker-end': edge.dashed ? 'url(#arrowDashed)' : 'url(#arrowFlow)'});
  var hit = svgEl('path', {class:'edge-hit', d:d, 'data-pay':edge.pay});
  container.appendChild(line);
  container.appendChild(hit);

  var fromNode = getNode(edge.f), toNode = getNode(edge.t);
  var edgeLabel = '<b>'+(fromNode.name||fromNode.label)+' → '+(toNode.name||toNode.label)+'</b><br>'+edge.pay;
  hit.addEventListener('mousemove', function(ev){ showTip(ev, edgeLabel); });
  hit.addEventListener('mouseleave', hideTip);

  if(edge.flow){
    var pathId = 'edgepath-'+Math.random().toString(36).slice(2,9);
    line.setAttribute('id', pathId);
    var dot = svgEl('circle', {class:'edge-dot', r:'3.2'});
    var anim = svgEl('animateMotion', {dur:(4+Math.random()*2).toFixed(1)+'s', repeatCount:'indefinite', rotate:'0'});

    mp.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+pathId);
    anim.appendChild(mp);
    dot.appendChild(anim);
    container.appendChild(dot);
  }
}

  var minGx=Infinity,maxGx=-Infinity,minGy=Infinity,maxGy=-Infinity;
  members.forEach(function(s){
    minGx=Math.min(minGx,s.gx); maxGx=Math.max(maxGx,s.gx+s.w);
    minGy=Math.min(minGy,s.gy); maxGy=Math.max(maxGy,s.gy+s.d);
  });
  return { gx:minGx-pad, gy:minGy-pad, w:(maxGx-minGx)+pad*2, d:(maxGy-minGy)+pad*2 };
}

function renderColonies(container){
  GROUPS.forEach(function(g){
    var bb = groupBBox(g.id, 0.28);
    if(!bb) return;
    var plate = Object.assign({h:0.32}, bb);
    var c = corners(plate);
    var top = svgEl('polygon', {class:'colony-top', points: pts([c.t0,c.t1,c.t2,c.t3]), fill:'var(--col-'+g.id+')'});
    var right = svgEl('polygon', {class:'colony-side', points: pts([c.g1,c.g2,c.t2,c.t1]), fill:'var(--col-'+g.id+'-edge)'});
    var left = svgEl('polygon', {class:'colony-side', points: pts([c.g2,c.g3,c.t3,c.t2]), fill:'var(--col-'+g.id+'-edge)'});
    container.appendChild(top); container.appendChild(right); container.appendChild(left);
  });
}

/* Labels render in their own top-most layer (after every building) so a tall
   neighboring block can never fully hide one — worst case it sits on a roof,
   which the background chip keeps legible. */
function renderColonyLabels(container){
  GROUPS.forEach(function(g){
    var bb = groupBBox(g.id, 0.28);
    if(!bb) return;
    var plate = Object.assign({h:0.32}, bb);
    var c = corners(plate);
    var text = svgEl('text', {class:'colony-label', x:c.t2.x.toFixed(1), y:(c.t2.y+18).toFixed(1), 'text-anchor':'middle'});
    text.textContent = g.short;
    container.appendChild(text);
    var box = text.getBBox();
    var pad = 3;
    var chip = svgEl('rect', {class:'colony-label-bg', x:(box.x-pad).toFixed(1), y:(box.y-pad).toFixed(1),
      width:(box.width+pad*2).toFixed(1), height:(box.height+pad*2).toFixed(1), rx:'2'});
    container.insertBefore(chip, text);
  });
}

function renderOverview(){
  world.innerHTML = '';
  var order = STRUCTURES.slice().sort(function(a,b){
    return (a.gx+a.w/2+a.gy+a.d/2) - (b.gx+b.w/2+b.gy+b.d/2);
  });
  var colonyLayer = svgEl('g', {class:'colony-layer'});
  var edgeLayer = svgEl('g', {class:'edge-layer'});
  var structLayer = svgEl('g', {class:'struct-layer'});
  var extLayer = svgEl('g', {class:'ext-layer'});
  var labelLayer = svgEl('g', {class:'colony-label-layer'});
  world.appendChild(colonyLayer);
  renderColonies(colonyLayer);
  world.appendChild(edgeLayer);
  EDGES.forEach(function(e){ renderEdge(e, edgeLayer); });
  order.forEach(function(s){ renderStructure(s, structLayer); });
  world.appendChild(structLayer);
  EXTERNALS.forEach(function(e){ renderExternal(e, extLayer); });
  world.appendChild(extLayer);
  world.appendChild(labelLayer);
  renderColonyLabels(labelLayer);
  traceFxLayer = svgEl('g', {class:'trace-fx'});
  world.appendChild(traceFxLayer);
  breadcrumb.classList.remove('show');
  applyZoomPan();
}

function renderInside(id){
  var s = byId[id];
  world.innerHTML = '';
  var layer = svgEl('g', {});
  world.appendChild(layer);
  renderChildRow(s, layer);
  breadcrumb.innerHTML = '<span>'+s.name.toUpperCase()+'</span><button id="backBtn">← all systems</button>';
  breadcrumb.classList.add('show');
  document.getElementById('backBtn').addEventListener('click', function(){ goOverview(); });
  applyZoomPan();
}

/* ============================== INTERACTION ============================== */

function setHover(id){
  state.hoverId = id;
  updateVisualState();
  if(!state.pinnedId) renderPanel();
}
function togglePin(id){
  state.pinnedId = (state.pinnedId===id) ? null : id;
  updateVisualState();
  renderPanel();
  updateRailPinned();
}
function updateRailPinned(){
  railEl.querySelectorAll('.rail-item').forEach(function(btn){
    btn.classList.toggle('pinned', btn.dataset.id===state.pinnedId);
  });
}
function updateVisualState(){
  var activeId = state.hoverId || state.pinnedId;
  document.querySelectorAll('.struct').forEach(function(g){
    var id = g.dataset.id;
    g.classList.toggle('hover', id===state.hoverId);
    g.classList.toggle('pinned', id===state.pinnedId);
  });
  document.querySelectorAll('.external').forEach(function(g){
    g.classList.toggle('hover', g.dataset.id===state.hoverId);
  });
}
function goInside(id){
  state.insideId = id;
  state.pinnedId = null;
  renderInside(id);
  window.location.hash = 'inside='+id;
  renderPanel();
}
function goOverview(){
  state.insideId = null;
  state.pinnedId = null;
  state.traceIndex = -1;
  renderOverview();
  traceBanner.classList.remove('show');
  window.location.hash='';
  renderPanel();
  updateRailPinned();
}

svg.addEventListener('click', function(ev){
  if(ev.target === svg || ev.target.id==='bgrect'){
    state.pinnedId = null; updateVisualState(); renderPanel(); updateRailPinned();
  }
});

document.getElementById('btnReset').addEventListener('click', goOverview);

/* ---- Theme toggle ---- */
var btnTheme = document.getElementById('btnTheme');
function syncThemeButton(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btnTheme.textContent = isDark ? '☀ Light' : '🌙 Dark';
}
syncThemeButton();
btnTheme.addEventListener('click', function(){
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('atlas-theme', next); }catch(e){}
  syncThemeButton();
});

document.getElementById('btnPause').addEventListener('click', function(){
  state.paused = !state.paused;
  this.setAttribute('aria-pressed', state.paused);
  this.textContent = state.paused ? 'Resume the flow' : 'Pause the flow';
  if(state.paused) svg.pauseAnimations(); else svg.unpauseAnimations();
});

document.getElementById('btnTrace').addEventListener('click', function(){
  if(state.insideId) goOverview();
  if(state.traceIndex >= TRACE.length-1) return;
  var prevIndex = state.traceIndex;
  state.traceIndex = state.traceIndex + 1;
  runTraceStep(prevIndex);
});

document.getElementById('btnTraceBack').addEventListener('click', function(){
  if(state.insideId) goOverview();
  if(state.traceIndex <= 0) return;
  var prevIndex = state.traceIndex;
  state.traceIndex = state.traceIndex - 1;
  runTraceStep(prevIndex);
});

function spawnTraceFx(fromId, toId){
  if(!traceFxLayer || fromId===toId) return;
  traceFxLayer.innerHTML = '';
  var from = edgeAnchor(fromId), to = edgeAnchor(toId);
  var midx = (from.x+to.x)/2;
  var d = 'M '+from.x.toFixed(1)+','+from.y.toFixed(1)+
          ' L '+midx.toFixed(1)+','+from.y.toFixed(1)+
          ' L '+midx.toFixed(1)+','+to.y.toFixed(1)+
          ' L '+to.x.toFixed(1)+','+to.y.toFixed(1);
  var pathId = 'tracefx-'+Math.random().toString(36).slice(2,9);
  var path = svgEl('path', {id:pathId, d:d, fill:'none', stroke:'none'});
  var dot = svgEl('circle', {class:'trace-fx-dot', r:'6'});
  var anim = svgEl('animateMotion', {dur:'0.8s', begin:'0s', fill:'freeze'});
  var mp = svgEl('mpath', {});
  mp.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+pathId);
  anim.appendChild(mp);
  var fade = svgEl('animate', {attributeName:'opacity', from:'1', to:'0', begin:'0.8s', dur:'0.5s', fill:'freeze'});
  dot.appendChild(anim); dot.appendChild(fade);
  traceFxLayer.appendChild(path);
  traceFxLayer.appendChild(dot);
}

function runTraceStep(prevIndex){
  var step = TRACE[state.traceIndex];
  var id = step[0], text = step[1];
  document.getElementById('traceStep').textContent = 'STEP '+(state.traceIndex+1)+' / '+TRACE.length;
  document.getElementById('traceText').textContent = text;
  traceBanner.classList.add('show');
  window.location.hash = 'trace='+state.traceIndex;

  document.querySelectorAll('.struct').forEach(function(g){
    g.classList.toggle('trace-active', g.dataset.id===id);
    g.classList.toggle('dim', g.dataset.id!==id && !isExternalId(id));
  });
  document.querySelectorAll('.external').forEach(function(g){
    g.classList.toggle('trace-active', g.dataset.id===id);
    g.classList.toggle('dim', g.dataset.id!==id);
  });
  if(!isExternalId(id)){
    document.querySelectorAll('.struct').forEach(function(g){
      if(g.dataset.id!==id) g.classList.add('dim');
    });
  }
  if(prevIndex!=null && prevIndex>=0 && prevIndex!==state.traceIndex){
    spawnTraceFx(TRACE[prevIndex][0], id);
  }
  state.pinnedId = null;
  showPanelFor(Object.assign({id:id, name: (byId[id]||extById[id]).name || (byId[id]||extById[id]).label}, byId[id]||extById[id]));
}

document.getElementById('zoomIn').addEventListener('click', function(){ state.zoom=Math.min(2.6,state.zoom*1.2); applyZoomPan(); });
document.getElementById('zoomOut').addEventListener('click', function(){ state.zoom=Math.max(0.45,state.zoom/1.2); applyZoomPan(); });
svg.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var factor = ev.deltaY<0 ? 1.08 : 0.93;
  state.zoom = Math.max(0.45, Math.min(2.6, state.zoom*factor));
  applyZoomPan();
}, {passive:false});

var dragging=false, dragStart=null;
svg.addEventListener('mousedown', function(ev){ dragging=true; dragStart={x:ev.clientX,y:ev.clientY,panX:state.panX,panY:state.panY}; svg.classList.add('panning'); });
window.addEventListener('mousemove', function(ev){
  if(!dragging) return;
  var vb = svg.viewBox.baseVal;
  var scaleX = vb.width / svg.clientWidth, scaleY = vb.height / svg.clientHeight;
  state.panX = dragStart.panX + (ev.clientX-dragStart.x)*scaleX;
  state.panY = dragStart.panY + (ev.clientY-dragStart.y)*scaleY;
  applyZoomPan();
});
window.addEventListener('mouseup', function(){ dragging=false; svg.classList.remove('panning'); });

function applyZoomPan(){
  world.setAttribute('transform', 'translate('+state.panX.toFixed(1)+','+state.panY.toFixed(1)+') scale('+state.zoom.toFixed(3)+')');
}

/* ============================== PANEL ============================== */

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    state.activeTab = t.dataset.tab;
    renderPanel();
  });
});

function showPanelFor(node){
  var isWhat = state.activeTab==='what';
  var body = isWhat ? node.what : (node.how || node.what);
  panelScroll.innerHTML =
    '<div class="panel-eyebrow">'+(node.group ? GROUPS.filter(function(g){return g.id===node.group;})[0].label : 'external dependency')+'</div>'+
    '<h2 class="panel-title">'+node.name+'</h2>'+
    (node.loc ? '<div class="panel-meta mono">'+node.loc+'</div>' : '') +
    '<div class="panel-body"><p>'+body+'</p></div>'+
    (talksHtml(node));
  wireTalks();
}

function talksHtml(node){
  if(!node.id || !byId[node.id]) return '';
  var s = byId[node.id];
  var outgoing = EDGES.filter(function(e){ return e.f===s.id; });
  var incoming = EDGES.filter(function(e){ return e.t===s.id; });
  if(!outgoing.length && !incoming.length) return '';
  var rows = [];
  outgoing.forEach(function(e){ var n=getNode(e.t); rows.push({dir:'→', id:e.t, name:n.name||n.label, pay:e.pay}); });
  incoming.forEach(function(e){ var n=getNode(e.f); rows.push({dir:'←', id:e.f, name:n.name||n.label, pay:e.pay}); });
  var html = '<hr class="panel-hr"><div class="panel-section-label">Talks to</div><ul class="talks-list">';
  rows.forEach(function(r){
    html += '<li><button class="mono" data-jump="'+r.id+'">'+r.dir+' '+r.name+'</button><span class="talk-pay">'+r.pay+'</span></li>';
  });
  html += '</ul>';
  if(s.children){ html += '<button class="pin-x" id="goInsideBtn">Go inside →</button>'; }
  return html;
}
function wireTalks(){
  panelScroll.querySelectorAll('[data-jump]').forEach(function(btn){
    btn.addEventListener('click', function(){ togglePin(btn.dataset.jump); updateRailPinned(); });
  });
  var gi = document.getElementById('goInsideBtn');
  if(gi) gi.addEventListener('click', function(){ goInside(state.pinnedId); });
}

function renderOverviewPanel(){
  var d = state.activeTab==='what' ? OVERVIEW_WHAT : OVERVIEW_HOW;
  panelScroll.innerHTML =
    '<div class="panel-eyebrow">'+d.eyebrow+'</div>'+
    '<h2 class="panel-title">'+d.title+'</h2>'+
    '<p class="panel-sub">'+d.sub+'</p>'+
    '<div class="panel-body">'+d.body.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>'+
    '<hr class="panel-hr">'+
    '<div class="panel-section-label">How to read it</div>'+
    '<div class="panel-body"><p>'+READ_IT+'</p></div>';
}

function renderPanel(){
  var activeId = state.pinnedId || state.hoverId;
  if(activeId){
    var node = getNode(activeId);
    if(node) { showPanelFor(Object.assign({id:activeId}, node)); return; }
  }
  renderOverviewPanel();
}

/* ============================== INIT ============================== */

function initFromHash(){
  var h = window.location.hash.replace('#','');
  if(h.indexOf('inside=')===0){
    var id = h.split('=')[1];
    if(byId[id] && byId[id].children){ state.insideId=id; renderInside(id); renderPanel(); return; }
  }
  if(h.indexOf('trace=')===0){
    var n = parseInt(h.split('=')[1],10);
    if(!isNaN(n) && n>=0 && n<TRACE.length){ renderOverview(); state.traceIndex=n; runTraceStep(); return; }
  }
  renderOverview();
  renderPanel();
}

buildRail();
initFromHash();

})();
</script>
